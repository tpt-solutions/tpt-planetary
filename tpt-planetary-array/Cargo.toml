[package]
name = "tpt-planetary-array"
description = "Chunked N-D arrays, Zarr and lazy evaluation for tpt-planetary (NetCDF/HDF5 replacement)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["zarr", "ndarray", "netcdf", "chunked", "climate"]
categories = ["science", "data-structures"]

[features]
default = ["std"]
# Tabular bridge to tpt-strata (MIT OR Apache-2.0, no dependencies). Parquet is
# not used: its Apache-2.0-only dependencies are outside the licence policy.
strata = ["std", "dep:tpt-strata"]
# Enables the in-memory and local-filesystem stores and std::error integration.
std = []
# Vectorised elementwise and reduction kernels via tpt-simd-vector (MIT OR Apache-2.0,
# rust-version 1.95). Off by default; the scalar code is the reference.
simd = ["dep:tpt-simd-vector"]
# Parallel evaluation of lazy-expression blocks with `std::thread::scope` (see
# `EvalOptions::workers`). Off by default: the serial path is the reference.
threads = ["std"]

[dependencies]
# Pure-Rust DEFLATE/zlib (MIT OR Zlib OR Apache-2.0), rust-version not declared upstream; builds on the workspace MSRV.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# Fixed-width SIMD vector type for the `simd` feature (MIT OR Apache-2.0, rust-version 1.95), no_std, forbid(unsafe).
tpt-simd-vector = { version = "0.1.1", default-features = false, optional = true }
# Pure-Rust Zstandard decoder and basic encoder (MIT, rust-version 1.87), no_std + alloc.
# Default features off: the `hash` feature (content checksums) is not enabled.
ruzstd = { version = "0.9.1", default-features = false, features = ["hash"] }
# Pure-Rust LZ4 block format (MIT).
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode"] }
# JSON for Zarr metadata (MIT OR Apache-2.0).
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# Columnar query engine for the tabular bridge (MIT OR Apache-2.0, no external dependencies).
tpt-strata = { version = "0.1.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
# Benchmark harness (MIT OR Apache-2.0, rust-version 1.80).
divan = { version = "0.1.21", default-features = false }

[[bench]]
name = "array"
harness = false
