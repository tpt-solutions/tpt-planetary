[package]
name = "tpt-planetary-cli"
description = "The tptplan command-line tool for tpt-planetary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["astronomy", "climate", "zarr", "cli"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "tptplan"
path = "src/main.rs"

[dependencies]
tpt-planetary-core = { workspace = true, features = ["std"] }
tpt-planetary-array.workspace = true
tpt-planetary-astro.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help", "string"] }
clap_complete = "4.6"
clap_mangen = "0.3"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
